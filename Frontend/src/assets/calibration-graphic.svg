<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" fill="none">
  <!-- Subtle technical grid -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#143e60" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="24" cy="24" r="0.8" fill="#008B8B" fill-opacity="0.5" />
    </pattern>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008B8B" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#008B8B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="540" height="400" fill="transparent" />
  <rect x="30" y="30" width="480" height="340" fill="url(#grid)" opacity="0.85" rx="6" stroke="#194870" stroke-width="1" />

  <!-- Outer measurement calibration frame -->
  <!-- Top scale ticks -->
  <g stroke="#3a6890" stroke-width="1" opacity="0.75">
    <line x1="60" y1="30" x2="60" y2="40" />
    <line x1="84" y1="30" x2="84" y2="36" />
    <line x1="108" y1="30" x2="108" y2="36" />
    <line x1="132" y1="30" x2="132" y2="36" />
    <line x1="156" y1="30" x2="156" y2="42" stroke="#008B8B" stroke-width="1.5" />
    <line x1="180" y1="30" x2="180" y2="36" />
    <line x1="204" y1="30" x2="204" y2="36" />
    <line x1="228" y1="30" x2="228" y2="36" />
    <line x1="252" y1="30" x2="252" y2="42" stroke="#008B8B" stroke-width="1.5" />
    <line x1="276" y1="30" x2="276" y2="36" />
    <line x1="300" y1="30" x2="300" y2="36" />
    <line x1="324" y1="30" x2="324" y2="36" />
    <line x1="348" y1="30" x2="348" y2="42" stroke="#008B8B" stroke-width="1.5" />
    <line x1="372" y1="30" x2="372" y2="36" />
    <line x1="396" y1="30" x2="396" y2="36" />
    <line x1="420" y1="30" x2="420" y2="36" />
    <line x1="444" y1="30" x2="444" y2="40" />
    <line x1="468" y1="30" x2="468" y2="36" />
  </g>

  <!-- Technical Axis and Calibration Specs -->
  <text x="42" y="24" fill="#678fae" font-family="monospace" font-size="9" letter-spacing="1">CAL_REF // NAWI-OIML-R76-E1</text>
  <text x="410" y="24" fill="#008B8B" font-family="monospace" font-size="9" letter-spacing="1">PRECISION: ±0.0001g</text>

  <!-- Center Metrology / Balance Scale Engineering Silhouette -->
  <!-- Base platform -->
  <line x1="170" y1="310" x2="370" y2="310" stroke="#48789f" stroke-width="2" />
  <line x1="200" y1="316" x2="340" y2="316" stroke="#255177" stroke-width="1.5" />
  <!-- Central Pillar -->
  <line x1="270" y1="310" x2="270" y2="150" stroke="#5a8db8" stroke-width="2.5" />
  <!-- Pillar Vernier Markings -->
  <g stroke="#008B8B" stroke-width="1" opacity="0.8">
    <line x1="264" y1="180" x2="276" y2="180" />
    <line x1="266" y1="200" x2="274" y2="200" />
    <line x1="264" y1="220" x2="276" y2="220" />
    <line x1="266" y1="240" x2="274" y2="240" />
    <line x1="262" y1="260" x2="278" y2="260" stroke-width="1.5" />
    <line x1="266" y1="280" x2="274" y2="280" />
  </g>

  <!-- Fulcrum and Pivot -->
  <polygon points="270,146 261,162 279,162" fill="#008B8B" opacity="0.9" />
  <circle cx="270" cy="146" r="3.5" fill="#ffffff" stroke="#123B5D" stroke-width="1.5" />

  <!-- Main Balance Beam -->
  <line x1="140" y1="146" x2="400" y2="146" stroke="#689cc9" stroke-width="2" />
  <!-- Leveling indicator arc -->
  <path d="M 252 134 A 20 20 0 0 1 288 134" fill="none" stroke="#008B8B" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="270" y1="130" x2="270" y2="142" stroke="#00e5ff" stroke-width="1.5" />

  <!-- Left Suspension & Pan -->
  <line x1="160" y1="146" x2="160" y2="215" stroke="#48789f" stroke-width="1.2" stroke-dasharray="4,2" />
  <line x1="130" y1="215" x2="190" y2="215" stroke="#79aedb" stroke-width="2" />
  <path d="M 130 215 C 130 226 190 226 190 215" fill="#143e60" stroke="#79aedb" stroke-width="1" opacity="0.7" />
  <!-- Test standard weight cylinder on left pan -->
  <rect x="150" y="193" width="20" height="22" rx="1.5" fill="#1e4c73" stroke="#008B8B" stroke-width="1.2" />
  <text x="154" y="208" fill="#e0f2fe" font-family="monospace" font-size="7.5" font-weight="bold">m₀</text>

  <!-- Right Suspension & Pan -->
  <line x1="380" y1="146" x2="380" y2="215" stroke="#48789f" stroke-width="1.2" stroke-dasharray="4,2" />
  <line x1="350" y1="215" x2="410" y2="215" stroke="#79aedb" stroke-width="2" />
  <path d="M 350 215 C 350 226 410 226 410 215" fill="#143e60" stroke="#79aedb" stroke-width="1" opacity="0.7" />
  <!-- Calibration mass on right pan -->
  <rect x="371" y="196" width="18" height="19" rx="1.5" fill="#1e4c73" stroke="#5a8db8" stroke-width="1.2" />
  <text x="375" y="209" fill="#e0f2fe" font-family="monospace" font-size="7.5" font-weight="bold">m₁</text>

  <!-- Tolerance / Error curve overlay (Gaussian / Error envelope) -->
  <path d="M 70 330 C 180 330 220 280 270 280 C 320 280 360 330 470 330" fill="none" stroke="url(#lineGrad)" stroke-width="2" />
  <!-- Nodes on curve -->
  <circle cx="220" cy="295" r="3" fill="#008B8B" stroke="#ffffff" stroke-width="1" />
  <circle cx="270" cy="280" r="3.5" fill="#38bdf8" stroke="#0B263D" stroke-width="1.5" />
  <circle cx="320" cy="295" r="3" fill="#008B8B" stroke="#ffffff" stroke-width="1" />

  <!-- Metric coordinate callouts -->
  <g font-family="monospace" font-size="8" fill="#7ba3c4">
    <text x="278" y="278">Δe ≤ 0.2 d [PASS]</text>
    <text x="64" y="324">ZERO_PT</text>
    <text x="440" y="324">MAX_CAP</text>
  </g>

  <!-- Horizontal Technical Data Stream Lines -->
  <line x1="50" y1="90" x2="490" y2="90" stroke="#1d486f" stroke-width="1" stroke-dasharray="6,4" />
  <circle cx="110" cy="90" r="2.5" fill="#008B8B" />
  <circle cx="270" cy="90" r="2.5" fill="#008B8B" />
  <circle cx="430" cy="90" r="2.5" fill="#008B8B" />
  <text x="116" y="86" fill="#5b86a8" font-family="monospace" font-size="7.5">CH-01: TARE STABLE</text>
  <text x="276" y="86" fill="#5b86a8" font-family="monospace" font-size="7.5">FILTER: CLASS III</text>
  <text x="436" y="86" fill="#5b86a8" font-family="monospace" font-size="7.5">SIGMA: 0.002</text>
</svg>